services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: surf_ai
      POSTGRES_USER: surf_ai
      POSTGRES_PASSWORD: surf_ai
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surf_ai"]
      interval: 3s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: surf
      RABBITMQ_DEFAULT_PASS: surf
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: surfai
      MINIO_ROOT_PASSWORD: surfaikey
    ports: ["9000:9000", "9091:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 surfai surfaikey &&
      mc mb --ignore-existing local/surf-ai &&
      echo 'bucket ready'"
